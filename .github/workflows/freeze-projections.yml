name: Freeze projections before the deadline

# The accuracy page is the whole trust argument, and until now it graded every
# gameweek by re-predicting it afterwards from pre-deadline data. That is
# honest but it is a reconstruction: it shows the model *could* have made the
# call, not that it did, and the code in between is ours to change.
#
# This writes the projection out before the deadline and commits it, so the
# grade becomes a pre-commitment - dated, attributed to a commit, and
# falsifiable. See backend/tools/freeze_projections.py.
#
# Runs four times a day rather than at a fixed time because deadlines move:
# FPL sets them 90 minutes before the gameweek's first kick-off, which drifts
# across Friday evening, Saturday lunchtime and the occasional Tuesday. The
# tool does nothing unless the next deadline is inside its window, and it
# never overwrites a file it has already written, so extra runs are free.
#
# Pushes to main rather than opening a PR, unlike the snapshot refresh: a
# frozen projection is only worth having if it lands before kick-off, and a PR
# waiting for review over a weekend would miss every deadline it exists for.
# The tradeoff is safe because the file is additive - it never touches code,
# never rewrites an existing freeze, and nothing in the app reads it until the
# gameweek is over.

on:
  schedule:
    - cron: "0 6,11,16,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: freeze-projections
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Freeze the next gameweek if its deadline is close
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m tools.freeze_projections

      - name: Commit the freeze if one was written
        run: |
          set -euo pipefail
          if git diff --quiet --exit-code data/projections && \
             [ -z "$(git status --porcelain data/projections)" ]; then
            echo "Nothing frozen this run."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projections
          git commit -m "chore(accuracy): freeze projections before the deadline"
          git push
