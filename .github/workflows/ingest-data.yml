name: Ingest FPL data

# Pulls the latest FPL data into the database on a schedule. Each run:
#   1. applies any new Alembic migrations,
#   2. snapshots bootstrap-static + fixtures (prices, status/news, reschedules),
#   3. ingests any gameweek that has finished since the last run.
# The ingest is idempotent (upserts + finished-GW diffing), so extra runs are
# harmless. Every ~6h catches a finished gameweek within a few hours and keeps
# prices/availability fresh; tune the cron as needed.
#
# Requires a DATABASE_URL repo secret pointing at the production database
# (must be reachable from GitHub-hosted runners). Also runs on demand.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # A bare `exit 0` here only succeeds *this* step - every later step in
      # the job still runs regardless, so a genuinely missing secret used to
      # mean "alembic/ingest run anyway with an empty DATABASE_URL and fail"
      # rather than a clean skip (confirmed directly from a failed run's
      # logs: the guard step showed success, but "Apply migrations" then hit
      # `DATABASE_URL: ` empty and crashed with a SQLAlchemy URL-parse
      # error). Using a step output + `if:` on every later step actually
      # skips them.
      - name: Check DATABASE_URL secret
        id: check_db
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "has_db=false" >> "$GITHUB_OUTPUT"
            echo "DATABASE_URL secret not set - skipping ingest."
          else
            echo "has_db=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check_db.outputs.has_db == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        if: steps.check_db.outputs.has_db == 'true'
        run: pip install -r requirements.txt

      - name: Apply migrations
        if: steps.check_db.outputs.has_db == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: alembic upgrade head

      - name: Ingest latest data
        if: steps.check_db.outputs.has_db == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m ingest run
