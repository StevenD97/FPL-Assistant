services:
  - type: web
    name: fpl-assistant-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn fpl.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false
      - key: API_FOOTBALL_KEY
        sync: false
      # sync: false = set the value in the Render dashboard, not in git.
      # Unset is survivable rather than fatal: allow_file_fallback means the
      # app serves the committed snapshots in data/ instead, which is how the
      # site stayed up when the previous database expired. Check which one is
      # live with /api/data-status.
      - key: DATABASE_URL
        sync: false

  # NOTE: there is deliberately no cron service here any more.
  #
  # This file used to define an hourly `fpl.data.ingest run` cron on Render's
  # starter plan (cron jobs are not available on the free plan, unlike the web
  # service above), duplicating .github/workflows/ingest-data.yml, which does
  # the same work on GitHub Actions for nothing. One scheduler, not two, and
  # not a paid one - see DEPLOYMENT.md.
  #
  # DATABASE_URL still belongs on the web service if you want it reading from
  # Postgres rather than the committed snapshots in data/.
